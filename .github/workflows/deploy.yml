name: Portfolio CI and deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify production container builds
        run: docker build --target runtime -t portfolio-ci .

  deploy:
    name: Request private Dokploy deployment
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Join Tailscale using GitHub OIDC
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:portfolio-deploy
          hostname: portfolio-deploy-${{ github.run_id }}
      - name: Verify private network scope
        shell: python
        run: |
          import socket
          host = '100.109.225.37'
          with socket.create_connection((host, 3000), timeout=15):
              print('Dokploy is reachable over Tailscale.')
          for port in (22, 3001, 8090, 4180):
              try:
                  connection = socket.create_connection((host, port), timeout=3)
              except OSError:
                  continue
              connection.close()
              raise SystemExit(f'Unexpected access to port {port}; refusing deployment.')
          print('Restricted-port probes returned no connection.')
      - name: Trigger deployment of checked main revision
        shell: python
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}), NoRedirect()
          )
          url = os.environ['DOKPLOY_WEBHOOK_URL']
          parsed = urllib.parse.urlsplit(url)
          if (parsed.scheme != 'http' or parsed.hostname != '100.109.225.37'
              or parsed.port != 3000 or parsed.username or parsed.password
              or parsed.query or parsed.fragment
              or not re.fullmatch(r'/api/deploy/[A-Za-z0-9_-]+', parsed.path)):
              raise SystemExit('Webhook must target the production application at the approved private Dokploy origin.')

          repository = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/git/ref/heads/main',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json'}
          )
          with opener.open(req, timeout=30) as response:
              current = json.load(response)['object']['sha']
          if current != sha:
              raise SystemExit('main advanced since these checks; refusing a stale deployment request.')

          payload = {
              'ref': 'refs/heads/main',
              'after': sha,
              'head_commit': {'id': sha, 'message': f'GitHub Actions checked revision {sha}'},
              'commits': [],
              'repository': {'full_name': repository},
          }
          request = urllib.request.Request(
              url, data=json.dumps(payload).encode(), method='POST',
              headers={'Content-Type': 'application/json', 'X-GitHub-Event': 'push'}
          )
          try:
              with opener.open(request, timeout=60) as response:
                  status = response.status
                  result = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f'Dokploy rejected the request: HTTP {exc.code}. Check Auto Deploy, branch and webhook configuration.') from None
          except Exception:
              raise SystemExit('Dokploy request failed; inspect deployment history before retrying.') from None
          if status != 200 or result.get('message') != 'Application deployed successfully':
              raise SystemExit('Unexpected Dokploy acknowledgement; inspect deployment history.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'## Dokploy request accepted\nChecked revision: `{sha}`.\n\n'
                            'The webhook queues a build; it does not confirm completion. '
                            'Verify the deployment log and https://portfolio.acrazie.dev.\n')
          print('Dokploy accepted the deployment request; build completion is not yet verified.')
