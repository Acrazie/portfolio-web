name: Portfolio CD

on:
  workflow_run:
    workflows: ["Portfolio CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production through Dokploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REF: ${{ github.ref }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message || 'Deploying main' }}
        run: |
          deploy_token="${DOKPLOY_DEPLOY_URL##*/}"
          echo "::add-mask::$deploy_token"

          commit_sha="$HEAD_SHA"
          if [ -n "$HEAD_BRANCH" ]; then
            commit_ref="refs/heads/$HEAD_BRANCH"
          else
            commit_ref="$REF"
          fi
          commit_msg="$COMMIT_MESSAGE"

          payload=$(jq -nc \
            --arg ref "$commit_ref" \
            --arg sha "$commit_sha" \
            --arg msg "$commit_msg" \
            '{ref: $ref, head_commit: {id: $sha, message: $msg}, commits: []}')

          curl --fail --silent --show-error --output /dev/null \
            --request POST \
            --header "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET" \
            --header "X-GitHub-Event: push" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DOKPLOY_DEPLOY_URL"

      - name: Post-deployment HTTP Smoke Test
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "PRODUCTION_URL secret is not set. Skipping post-deploy smoke test."
            exit 0
          fi
          echo "Waiting 30 seconds for Dokploy to build and swap container in production..."
          sleep 30
          echo "Performing HTTP health check on $PRODUCTION_URL..."
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-connrefused "$PRODUCTION_URL" > /dev/null
          echo "Health check passed: Production site is responding with HTTP 200 OK!"

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          ACTOR: ${{ github.actor }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message || 'Déploiement production' }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured. Skipping notification."
            exit 0
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI="🚀"
            STATUS_TEXT="Déploiement en production réussi !"
          else
            EMOJI="🚨"
            STATUS_TEXT="Échec du déploiement en production !"
          fi

          SHORT_SHA="${HEAD_SHA:0:7}"

          MESSAGE=$(printf "%s *Portfolio - %s*\n\n*Branche :* \`%s\`\n*Commit :* \`%s\`\n*Message :* %s\n*Déclenché par :* %s" \
            "$EMOJI" "$STATUS_TEXT" "$HEAD_BRANCH" "$SHORT_SHA" "$COMMIT_MSG" "$ACTOR")

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="$MESSAGE" > /dev/null || true
